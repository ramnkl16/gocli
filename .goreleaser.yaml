# https://goreleaser.com
version: 2

project_name: gocli

before:
  hooks:
    - go mod tidy

builds:
  - id: gocli
    binary: gocli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X=main.version={{.Version}}
      - -X=main.commit={{.ShortCommit}}
      - -X=main.date={{.Date}}

archives:
  - id: default
    builds:
      - gocli
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    # Omit version so https://github.com/ORG/REPO/releases/latest/download/gocli_<Darwin|Linux|Windows>_<arch>.<ext> stays stable.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - Merge pull request
      - Merge branch
