# Hostname → brand folder under assets/ (http context).
# assets.cubcadet.com/na/x  →  assets/cubcadet/na/x
# assets.genuinefactoryparts.com/na/x  →  assets/gfp/na/x

map $host $ns_brand_folder {
    hostnames;

    assets.cubcadet.com             cubcadet;
    assets.genuinefactoryparts.com  gfp;

    default                         cubcadet;
}

map $host $brand_assets_root {
    hostnames;

    assets.cubcadet.com             /var/www/assets/cubcadet;
    assets.genuinefactoryparts.com  /var/www/assets/gfp;

    default                         /var/www/assets/cubcadet;
}
