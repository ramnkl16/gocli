services:
  nginx:
    build: .
    ports:
      - "8080:80"
    environment:
      # local = filesystem under ./static; netstorage = proxy to Akamai
      NGINX_DOMAIN_MODE: local
      NETSTORAGE_HOSTNAME: example-storage.ns.edgekey.net
      NETSTORAGE_HOST_HEADER: example-storage.ns.edgekey.net
      NETSTORAGE_SCHEME: https
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./snippets:/etc/nginx/snippets:ro
      - ./static:/var/www:ro
      - ./docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - nginx-generated:/etc/nginx/generated
      - nginx-cache:/var/cache/nginx
    entrypoint: ["/docker-entrypoint.sh"]

volumes:
  nginx-generated:
  nginx-cache:
