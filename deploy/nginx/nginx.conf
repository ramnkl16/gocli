worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'cache=$upstream_cache_status host=$host';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # Cache zone for NetStorage upstream responses (local testing / origin shield).
    proxy_cache_path /var/cache/nginx/netstorage
        levels=1:2
        keys_zone=netstorage_cache:10m
        max_size=256m
        inactive=60m
        use_temp_path=off;

    include /etc/nginx/generated/domains-active.conf;
}
