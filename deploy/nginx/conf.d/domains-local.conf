# Local: each asset hostname → its own folder under static/assets/

include snippets/brand-folder-map.conf;

server {
    listen 80;
    server_name
        assets.cubcadet.com
        assets.genuinefactoryparts.com;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    include snippets/shared-assets-local.conf;
}
