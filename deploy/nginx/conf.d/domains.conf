# NetStorage: each asset hostname → its own folder under assets/

resolver 127.0.0.11 valid=30s ipv6=off;

include snippets/brand-folder-map.conf;
include /etc/nginx/generated/netstorage-upstream.conf;

server {
    listen 80;
    server_name
        assets.cubcadet.com
        assets.genuinefactoryparts.com;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    include snippets/shared-assets-netstorage.conf;
}
